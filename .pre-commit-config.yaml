repos:
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: pnpm exec eslint --max-warnings 0 --no-warn-ignored
        language: system
        files: \.(ts|tsx|mjs)$
      - id: typecheck
        name: typecheck
        entry: pnpm exec tsc --noEmit
        language: system
        pass_filenames: false
      - id: tests
        name: tests
        entry: pnpm test
        language: system
        pass_filenames: false
